<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban · Arethesis</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <span class="status-pill" id="sse-status"></span>
        <label class="switch"><input type="checkbox" id="failures"> Simulate failures</label>
        <button class="btn btn--ghost" type="button" id="new-tab">Open in a new tab ↗</button>
      </div>
      <kanban-board></kanban-board>
      <p class="hint">Keyboard: Tab to a card, Space to pick it up, arrow keys to move it (←/→ change columns), Space to drop, Escape to cancel. Shift+F10 opens the card menu.</p>
    </main>
  </body>
</html>
