<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Agora · Arethesis</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <div class="field"><label for="name">Speak as</label><input id="name" autocomplete="off"></div>
        <span class="status-pill" id="sse-status"></span>
        <div class="field"><label for="network">Network</label><select id="network"></select></div>
        <label class="switch"><input type="checkbox" id="talk" checked> The agora talks</label>
        <label class="switch"><input type="checkbox" id="failures"> The server refuses writes</label>
      </div>
      <div class="agora-layout">
        <section aria-labelledby="question">
          <header class="agora-question">
            <p class="eyebrow" lang="grc">ἆρα διδακτὸν ἡ ἀρετή;</p>
            <h2 id="question">Is virtue teachable?</h2>
            <p>After Plato’s <cite>Meno</cite>.</p>
          </header>
          <form class="card agora-compose" id="compose">
            <label for="compose-body" class="label">Add your voice</label>
            <textarea id="compose-body" name="body" data-mixin="rich-text" data-mixin-rich-text-label="Your post" data-mixin-rich-text-placeholder="Make an argument. Socrates will probably ask what you mean."></textarea>
            <div class="form-actions"><button class="btn" type="submit">Post to the agora</button><span class="hint">Formatting is sanitized; links are checked.</span></div>
          </form>
          <div class="agora-sort" role="group" aria-label="Sort">
            <button type="button" class="btn btn--ghost btn--small" data-sort="score" aria-pressed="true">Best</button>
            <button type="button" class="btn btn--ghost btn--small" data-sort="createdAt" aria-pressed="false">Newest</button>
            <span class="hint">Page Up and Page Down move between posts.</span>
          </div>
          <agora-feed></agora-feed>
        </section>
        <aside class="card side-section agora-side" aria-label="Who is here">
          <h2>In the agora</h2>
          <ul class="people" id="speakers"></ul>
        </aside>
      </div>
    </main>
  </body>
</html>
